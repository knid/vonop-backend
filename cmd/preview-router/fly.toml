app = "wemob-previews"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  FLY_APP_NAME = "wemob-previews"
  PREVIEW_DOMAIN = "preview.wemob.app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
