services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - ./.env
    environment:
      - CADDY_ADMIN_URL=http://caddy:2019
      - CADDY_CUSTOM_DOMAINS_DIR=/data/custom-domains
    volumes:
      - repo-data:/data/repos
      - custom-domains:/data/custom-domains
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: caddy_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - custom-domains:/etc/caddy/custom-domains:ro
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
    depends_on:
      api:
        condition: service_healthy

  asynqmon:
    image: hibiken/asynqmon:latest
    container_name: asynqmon
    restart: unless-stopped
    expose:
      - "8080"
    # rediss:// URL form derives TLS + SNI from the host. --redis-insecure-tls
    # skips cert verification because hibiken/asynqmon's minimal image lacks
    # ca-certificates and can't validate DigitalOcean's managed Valkey cert.
    # Connection is still encrypted; the trust check is what's bypassed.
    command:
      - --redis-url=rediss://default:${REDIS_PASSWORD}@${REDIS_ADDR}/0
      - --redis-insecure-tls

volumes:
  caddy_data:
  caddy_config:
  repo-data:
  custom-domains:
