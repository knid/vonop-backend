services:
  api:
    image: ghcr.io/knid/wemob-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - ./.env
    environment:
      - CADDY_ADMIN_URL=http://caddy:2019
      - CADDY_CUSTOM_DOMAINS_DIR=/data/custom-domains
    volumes:
      - repo-data:/data/repos
      - custom-domains:/data/custom-domains
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  caddy:
    image: ghcr.io/knid/wemob-backend-caddy:${CADDY_IMAGE_TAG:-latest}
    container_name: caddy_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - custom-domains:/etc/caddy/custom-domains:ro
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
    depends_on:
      api:
        condition: service_healthy

  worker:
    image: ghcr.io/knid/wemob-backend:${IMAGE_TAG:-latest}
    entrypoint: ["/app/worker"]
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - CADDY_ADMIN_URL=http://caddy:2019
      - CADDY_CUSTOM_DOMAINS_DIR=/data/custom-domains
      - DB_MAX_OPEN_CONNS=10
    volumes:
      - repo-data:/data/repos
      - custom-domains:/data/custom-domains
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy

  asynqmon:
    image: hibiken/asynqmon:latest
    container_name: asynqmon
    restart: unless-stopped
    # Bound to the VPS's tailnet IP only — reachable as
    # http://wemob-backend.zebu-pain.ts.net:8080/ from any device on the
    # tailnet, not on the public internet. The IP is the value of
    # `tailscale ip -4` on this host; if you re-add the node to the
    # tailnet and it gets a different IP, update this line.
    ports:
      - "100.80.70.96:8080:8080"
    # Flag form: -redis-tls expects the hostname for SNI; -redis-insecure-tls
    # skips cert verification (the minimal image lacks ca-certificates so it
    # can't validate DO's managed Valkey cert chain). REDIS_HOST in .env is
    # the hostname without the port; REDIS_ADDR is host:port.
    command:
      - --redis-addr=${REDIS_ADDR}
      - --redis-password=${REDIS_PASSWORD}
      - --redis-tls=${REDIS_HOST}
      - --redis-insecure-tls

volumes:
  caddy_data:
  caddy_config:
  repo-data:
  custom-domains:
