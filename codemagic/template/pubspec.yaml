name: "wemob_app"
description: "Created by wemob.io"
publish_to: 'none'
version: 1.0.0+__CM_VERSION__

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.0.0
  url_launcher: ^6.3.2
  onesignal_flutter: ^5.3.4
  http: ^1.2.2
  shared_preferences: ^2.3.1
  uuid: ^4.4.2
  device_info_plus: ^11.0.0
  package_info_plus: ^8.0.0
  connectivity_plus: ^6.1.4
  share_plus: ^10.1.4
  local_auth: ^2.3.0
  in_app_review: ^2.0.9
  flutter_local_notifications: ^18.0.1
  app_links: ^6.3.3
  image_picker: ^1.1.2
  flutter_contacts: ^1.1.9+2
  file_picker: ^8.1.6
  flutter_blue_plus: ^1.35.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/icon/wemob-logo.png
    - assets/icon/wemob-logo-dark.png
