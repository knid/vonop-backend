[project]
name = "deepagents-runtime"
version = "0.1.0"
description = "Wemob deepagents runtime service (scaffold)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn>=0.34.0",
  "pydantic>=2.11.0",
  "deepagents>=0.6.0",
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-anthropic>=0.1.0",
  "langchain-openai>=0.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.28.0",
  "pytest-asyncio>=0.26.0"
]

[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
