services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8001:8001"
    env_file:
      - ./.env.dev
    environment:
      - BUNDEBUG=1
      - DEEPAGENTS_RUNTIME_URL=http://deepagents-runtime:8000
    depends_on:
      - db
      - deepagents-runtime

  deepagents-runtime:
    build:
      context: ./deepagents-runtime
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./.env.dev
    environment:
      - WEMOB_REPOS_BASE=/data/repos
      - GO_TOOL_BASE_URL=http://api:8001
    volumes:
      - repo-data:/data/repos

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass123
      - POSTGRES_DB=wemob
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  db_data:
  redis_data:
  repo-data:
