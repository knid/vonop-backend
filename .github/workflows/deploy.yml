name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/wemob-backend
  CADDY_IMAGE: ghcr.io/${{ github.repository_owner }}/wemob-backend-caddy

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: make lint-errors
      - run: go test ./...

  build:
    name: Build & push images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api/worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push caddy image
        uses: docker/build-push-action@v5
        with:
          context: ./caddy
          file: ./caddy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.CADDY_IMAGE }}:latest
            ${{ env.CADDY_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

  deploy:
    name: Deploy to API VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: sha-${{ needs.build.outputs.short_sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -euo pipefail
            cd /root/wemob-backend

            git fetch --prune origin
            git reset --hard origin/main

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export IMAGE_TAG
            # Apply to all services so non-build-pinned ones (asynqmon) pick up
            # compose-only changes (port rebinding, env, etc.) on subsequent
            # deploys. Without this, only api/worker/caddy got recreated and
            # an asynqmon ports change wouldn't take effect.
            docker compose pull
            docker compose up -d --remove-orphans --wait --wait-timeout 90

            # End-to-end smoke through the public path (Caddy → api). --resolve
            # short-circuits DNS so we hit the local Caddy directly, but still
            # presents api.wemob.io as the SNI/Host so Caddy serves the right
            # cert + vhost. Caddy has no compose healthcheck so we retry a few
            # times to cover its config-load + 443-bind warmup window.
            for attempt in 1 2 3 4 5; do
              if curl -fsS --resolve api.wemob.io:443:127.0.0.1 https://api.wemob.io/health > /dev/null; then
                echo "Smoke ok on attempt $attempt"
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "Smoke failed after 5 attempts" >&2
                docker compose logs --tail=80 api caddy
                exit 1
              fi
              sleep 2
            done

            docker image prune -f --filter "until=24h"
            docker logout ghcr.io
